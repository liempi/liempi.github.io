name: Update publications from NASA/ADS

on:
  schedule:
    - cron: "17 5 * * 1"   # every Monday, 05:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch publications from ADS
        env:
          ADS_API_TOKEN: ${{ secrets.ADS_API_TOKEN }}
        run: python3 scripts/fetch_ads.py

      - name: Commit if the list changed
        run: |
          # ignore the "generated" timestamp so we only commit real changes
          if git diff --quiet -I'"generated"' -- data/publications.json; then
            echo "No changes."
            git checkout -- data/publications.json
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/publications.json
            git commit -m "update: refresh publications from NASA/ADS"
            git push
          fi
